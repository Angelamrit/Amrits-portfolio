name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs write access to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A conflicted `git stash pop` that gets committed breaks everything below
      # with a confusing error; this names the files instead.
      - name: No merge-conflict markers
        run: "! git grep -nE '^(<{7}|>{7})( |$)'"

      - uses: actions/setup-node@v4
        with:
          # 24 or newer: the test script relies on Node running the TypeScript
          # sources directly, without a build step or a test framework.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Deliberately given no environment: the build must not depend on the
      # Resend credentials, and a missing mailer must stay a warning rather
      # than become a failure that blocks a deploy.
      - run: npm run build
